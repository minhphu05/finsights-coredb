name: Reconcile Core Databases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finsights-coredb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.postgres == 'true' }}
      mysql_node_1: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mysql_node_1 == 'true' }}
      mysql_node_2: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mysql_node_2 == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ github.token }}
          filters: .github/paths-filter.yml

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    environment: coredb-postgres
    timeout-minutes: 20
    env:
      FINSIGHTS_VPS_HOST: 103.249.117.232
      FINSIGHTS_VPS_PORT: "26567"
      FINSIGHTS_VPS_USER: root
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      DAGSTER_DB_PASSWORD: ${{ secrets.DAGSTER_DB_PASSWORD }}
      AUTH_SERVICE_DB_PASSWORD: ${{ secrets.AUTH_SERVICE_DB_PASSWORD }}
      USER_SERVICE_DB_PASSWORD: ${{ secrets.USER_SERVICE_DB_PASSWORD }}
      FINSIGHTS_VPS_SSH_KEY: ${{ secrets.FINSIGHTS_VPS_SSH_KEY }}
      FINSIGHTS_VPS_KNOWN_HOSTS: ${{ secrets.FINSIGHTS_VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/remote-apply.sh postgres

  mysql-node-1:
    needs: changes
    if: needs.changes.outputs.mysql_node_1 == 'true'
    runs-on: ubuntu-latest
    environment: coredb-mysql-node-1
    timeout-minutes: 20
    env:
      FINSIGHTS_VPS_HOST: 103.249.117.232
      FINSIGHTS_VPS_PORT: "26567"
      FINSIGHTS_VPS_USER: root
      MYSQL_NODE_1_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
      MYSQL_NODE_1_TLS_CA_PEM: ${{ secrets.MYSQL_TLS_CA_PEM }}
      MYSQL_NODE_1_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_ASSETS_APP_PASSWORD: ${{ secrets.MYSQL_ASSETS_APP_PASSWORD }}
      MYSQL_AUTH_APP_PASSWORD: ${{ secrets.MYSQL_AUTH_APP_PASSWORD }}
      MYSQL_MARKET_APP_PASSWORD: ${{ secrets.MYSQL_MARKET_APP_PASSWORD }}
      MYSQL_NEWS_APP_PASSWORD: ${{ secrets.MYSQL_NEWS_APP_PASSWORD }}
      MYSQL_USER_APP_PASSWORD: ${{ secrets.MYSQL_USER_APP_PASSWORD }}
      FINSIGHTS_VPS_SSH_KEY: ${{ secrets.FINSIGHTS_VPS_SSH_KEY }}
      FINSIGHTS_VPS_KNOWN_HOSTS: ${{ secrets.FINSIGHTS_VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/remote-apply.sh mysql-node-1

  mysql-node-2:
    needs: changes
    if: needs.changes.outputs.mysql_node_2 == 'true'
    runs-on: ubuntu-latest
    environment: coredb-mysql-node-2
    timeout-minutes: 20
    env:
      FINSIGHTS_VPS_HOST: 103.249.117.232
      FINSIGHTS_VPS_PORT: "26567"
      FINSIGHTS_VPS_USER: root
      MYSQL_NODE_2_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
      MYSQL_NODE_2_TLS_CA_PEM: ${{ secrets.MYSQL_TLS_CA_PEM }}
      MYSQL_NODE_2_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_AI_APP_PASSWORD: ${{ secrets.MYSQL_AI_APP_PASSWORD }}
      FINSIGHTS_VPS_SSH_KEY: ${{ secrets.FINSIGHTS_VPS_SSH_KEY }}
      FINSIGHTS_VPS_KNOWN_HOSTS: ${{ secrets.FINSIGHTS_VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/remote-apply.sh mysql-node-2
