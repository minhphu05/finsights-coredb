version: 1
target: mysql-node-2
engine: mysql
connection:
  host: 129.221.137.201
  tls_server_name: MySQL_Endpoint_Server
  port: 3306
  database: mysql
  username: finsightsadmin
  password_env: MYSQL_NODE_2_ADMIN_PASSWORD
  tls: verify
  tls_ca_file: mysql-node-2/certs/ca.pem
  connect_timeout: 10
managed_database_prefix: finsights_
managed_user_prefix: finsights_
database_charset: utf8mb4
database_collation: utf8mb4_unicode_ci
# CoreDB owns all finsights_ databases and users on this node.
drop_missing_databases: true
drop_missing_users: true
databases:
  - name: finsights_auth
    schemas:
      - schemas/auth.json
  - name: finsights_assets
    schemas:
      - schemas/assets.json
  - name: finsights_disclosures
    schemas:
      - schemas/disclosures.json
  - name: finsights_economy
    schemas:
      - schemas/economy.json
  - name: finsights_fundamentals
    schemas:
      - schemas/fundamentals.json
  - name: finsights_market
    schemas:
      - schemas/backend-market.json
  - name: finsights_market_data
    schemas:
      - schemas/market-data.json
  - name: finsights_news
    schemas:
      - schemas/news.json
  - name: finsights_scraping
    schemas:
      - schemas/scraping.json
  - name: finsights_user
    schemas:
      - schemas/user.json
users:
  - name: finsights_auth_app
    host: "%"
    password_env: MYSQL_AUTH_APP_PASSWORD
    database: finsights_auth
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_assets_app
    host: "%"
    password_env: MYSQL_ASSETS_APP_PASSWORD
    database: finsights_assets
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_disclosures_app
    host: "%"
    # The disclosure collector reuses the Node 2 collection credential until this domain has a dedicated secret.
    password_env: MYSQL_SCRAPING_APP_PASSWORD
    database: finsights_disclosures
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_economy_app
    host: "%"
    password_env: MYSQL_SCRAPING_APP_PASSWORD
    database: finsights_economy
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_fundamentals_app
    host: "%"
    password_env: MYSQL_SCRAPING_APP_PASSWORD
    database: finsights_fundamentals
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_market_app
    host: "%"
    password_env: MYSQL_MARKET_APP_PASSWORD
    database: finsights_market
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_market_data_app
    host: "%"
    password_env: MYSQL_SCRAPING_APP_PASSWORD
    database: finsights_market_data
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_news_app
    host: "%"
    password_env: MYSQL_NEWS_APP_PASSWORD
    database: finsights_news
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_scraping_app
    host: "%"
    password_env: MYSQL_SCRAPING_APP_PASSWORD
    database: finsights_scraping
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  - name: finsights_user_app
    host: "%"
    password_env: MYSQL_USER_APP_PASSWORD
    database: finsights_user
    privileges: [SELECT, INSERT, UPDATE, DELETE]
  # finsights-ai-service reads published news for its agent tools; read-only.
  - name: finsights_ai_ro
    host: "%"
    password_env: MYSQL_AI_RO_PASSWORD
    database: finsights_news
    privileges: [SELECT]
