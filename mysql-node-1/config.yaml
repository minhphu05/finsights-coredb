version: 1
target: mysql-node-1
engine: mysql
connection:
  host: 161.33.181.173
  tls_server_name: MySQL_Endpoint_Server
  port: 3306
  database: mysql
  username: finsightsadmin
  password_env: MYSQL_NODE_1_ADMIN_PASSWORD
  tls: verify
  tls_ca_file: mysql-node-1/certs/ca.pem
  connect_timeout: 10
managed_database_prefix: finsights_
managed_user_prefix: finsights_
database_charset: utf8mb4
database_collation: utf8mb4_unicode_ci
# Node 1 is reserved for AI-service databases. Keep legacy backend databases/users
# on disk during the placement cutover; do not drop existing data implicitly.
drop_missing_databases: false
drop_missing_users: false
databases:
  - name: finsights_ai
    schemas:
      - schemas/ai.json
users:
  - name: finsights_ai_app
    host: "%"
    password_env: MYSQL_AI_APP_PASSWORD
    database: finsights_ai
    privileges: [SELECT, INSERT, UPDATE, DELETE]
